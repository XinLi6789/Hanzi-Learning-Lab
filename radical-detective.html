<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Li's Hanzi Learning Lab — Radical Detective</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#17243d;font-family:Arial,sans-serif}.w{max-width:950px;margin:auto;padding:25px}.nav a{text-decoration:none;color:#3859a8;font-weight:bold}.c{background:white;border:1px solid #dfe5ee;border-radius:24px;padding:26px}.h{text-align:center;font-size:44px}.sub{text-align:center;color:#607089;font-size:18px}.q{font-size:24px;font-weight:bold}.rad{text-align:center;font-size:65px;font-weight:bold;margin:20px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:13px}.o{border:2px solid #dfe5ee;background:white;border-radius:16px;padding:17px;font-size:20px;cursor:pointer}.good{background:#effaf4;border-color:#218c5b}.bad{background:#fff1f1;border-color:#c54a4a}.fb{margin-top:16px;padding:14px;background:#f3f5f9;border-radius:12px}.b{background:#3859a8;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:bold;font-size:16px;cursor:pointer}@media(max-width:600px){.opts{grid-template-columns:1fr}}</style><style>
.student-modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.student-box{background:#fff;border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}.student-box h2{margin-top:0}.student-box label{display:block;font-weight:800;margin:12px 0 5px}.student-box input,.student-box select{width:100%;box-sizing:border-box;padding:12px;border:2px solid #cbd5e1;border-radius:10px;font:inherit}.student-box button,.submit-result-btn{margin-top:16px;border:0;border-radius:12px;padding:12px 18px;background:#1d4ed8;color:#fff;font-weight:800;cursor:pointer}.submit-result-btn:disabled{opacity:.55}.submit-status{margin-top:10px;font-weight:700}
</style></head>
<body><div class="student-modal" id="studentModal"><div class="student-box"><h2>Student Information</h2><p>Enter your name and class before starting.</p><label for="studentName">Name</label><input id="studentName" maxlength="24" autocomplete="name"><label for="studentClass">Class</label><select id="studentClass"><option value="">Choose class</option><option>Grade 6</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>IB DP1</option><option>Other</option></select><button id="studentStart">Start Activity</button><div class="submit-status" id="studentError"></div></div></div><div class="w"><div class="nav"><a href="index.html">← Hanzi Learning Lab</a></div><div id="a" style="margin-top:15px"></div></div>
<script>
const Q=[
["亻","PEOPLE","他","他 — he",["他 — he","河 — river","裤 — trousers","唱 — sing"]],
["口","MOUTH / SPEAKING","喝","喝 — drink",["喝 — drink","找 — look for","海 — sea","裤 — trousers"]],
["扌","HAND / ACTION","找","找 — look for",["找 — look for","晴 — sunny","妈 — mom","语 — language"]],
["女","FEMALE / FAMILY","妈","妈 — mom",["妈 — mom","河 — river","说 — speak","树 — tree"]],
["讠","SPEECH / LANGUAGE","说","说 — speak",["说 — speak","裤 — trousers","花 — flower","脚 — foot"]],
["氵","WATER","海","海 — sea",["海 — sea","唱 — sing","袖 — sleeve","姐 — older sister"]],
["艹","PLANTS / GRASS","花","花 — flower",["花 — flower","河 — river","找 — look for","礼 — courtesy"]],
["雨","RAIN / WEATHER","雪","雪 — snow",["雪 — snow","说 — speak","裤 — trousers","妈 — mom"]],
["木","TREES / WOOD","林","林 — forest",["林 — forest","说 — speak","裤 — trousers","脸 — face"]],
["日","SUN / DAY / TIME","晴","晴 — sunny",["晴 — sunny","海 — sea","找 — look for","姐 — older sister"]],
["月","BODY","脸","脸 — face",["脸 — face","海 — sea","说 — speak","花 — flower"]],
["足","FOOT / MOVEMENT","跑","跑 — run",["跑 — run","晴 — sunny","说 — speak","花 — flower"]],
["宀","HOUSE / ROOF","家","家 — home",["家 — home","河 — river","说 — speak","裤 — trousers"]],
["门","DOOR / ENTRANCE","问","问 — ask",["问 — ask","海 — sea","妈 — mom","林 — forest"]],
["目","EYES / SEEING","眼","眼 — eye",["眼 — eye","海 — sea","花 — flower","裤 — trousers"]],
["衤","CLOTHES / CLOTHING","裤","裤 — trousers",["裤 — trousers","祝 — bless","河 — river","姐 — older sister"]],
["礻","SPIRITUAL / RELIGION","祝","祝 — bless",["祝 — bless","裤 — trousers","海 — sea","找 — look for"]],
["纟","THREAD / SILK","线","线 — thread / line",["线 — thread / line","家 — home","眼 — eye","唱 — sing"]]
];
const M=[
["亻","PEOPLE",["PEOPLE","WATER","CLOTHING","PLANTS"]],
["口","MOUTH / SPEAKING",["MOUTH / SPEAKING","HOME / ROOF","TREES / WOOD","WEATHER"]],
["扌","HAND / ACTION",["HAND / ACTION","SPEECH / LANGUAGE","BODY","CLOTHING"]],
["女","FEMALE / FAMILY",["FEMALE / FAMILY","WATER","EYES / SEEING","THREAD / TEXTILE"]],
["讠","SPEECH / LANGUAGE",["SPEECH / LANGUAGE","PLANTS","FOOT / MOVEMENT","HOME / ROOF"]],
["氵","WATER",["WATER","PEOPLE","SUN / DAY / TIME","CLOTHING"]],
["艹","PLANTS / GRASS",["PLANTS / GRASS","BODY","MOUTH / SPEAKING","SPIRITUAL / RELIGION"]],
["雨","RAIN / WEATHER",["RAIN / WEATHER","SPEECH / LANGUAGE","CLOTHES / CLOTHING","PEOPLE"]],
["木","TREES / WOOD",["TREES / WOOD","WATER","FEMALE / FAMILY","FOOT / MOVEMENT"]],
["日","SUN / DAY / TIME",["SUN / DAY / TIME","EYES / SEEING","HOME / ROOF","THREAD / TEXTILE"]],
["月","BODY",["BODY","MOON ONLY","WATER","PLANTS"]],
["足","FOOT / MOVEMENT",["FOOT / MOVEMENT","SPEECH / LANGUAGE","TREES / WOOD","CLOTHES / CLOTHING"]],
["宀","HOUSE / ROOF",["HOUSE / ROOF","HAND / ACTION","WATER","EYES / SEEING"]],
["门","DOOR / ENTRANCE",["DOOR / ENTRANCE","RAIN / WEATHER","WATER","FEMALE / FAMILY"]],
["目","EYES / SEEING",["EYES / SEEING","PLANTS","PEOPLE","THREAD / TEXTILE"]],
["衤","CLOTHES / CLOTHING",["CLOTHES / CLOTHING","SPIRITUAL / RELIGION","WATER","BODY"]],
["礻","SPIRITUAL / RELIGION",["SPIRITUAL / RELIGION","CLOTHES / CLOTHING","TREES / WOOD","MOUTH / SPEAKING"]],
["纟","THREAD / SILK",["THREAD / SILK","HOUSE / ROOF","SUN / DAY / TIME","PLANTS / GRASS"]]
];
let part=1,i=0,s=0,lock=false,totalScore=0;const A=document.getElementById("a");function sh(x){return [...x].sort(()=>Math.random()-.5)}
function intro(){A.innerHTML='<div class="c" style="text-align:center"><div class="h">🔎 Radical Detective</div><p class="sub"><b>Part 1:</b> Use a radical as a clue to find a related Hanzi.<br><b>Part 2:</b> Identify what each radical is connected with.</p><button class="b" onclick="start()">Start Part 1</button></div>'}
function start(){part=1;i=0;s=0;totalScore=0;show()}
function show(){lock=false;let x=Q[i],o=sh(x[4]);A.innerHTML='<div class="c"><b>Part 1 — Character Clues　Question '+(i+1)+' / '+Q.length+'　Score: '+s+'/'+i+'</b><div class="q">Which character is most likely connected with <b>'+x[1]+'</b>?</div><div class="rad">'+x[0]+'</div><div class="opts">'+o.map(v=>'<button class="o" data-v="'+v+'" onclick="pick(this)">'+v+'</button>').join("")+'</div><div id="f" class="fb">Use the radical as your evidence.</div><p style="text-align:right"><button id="n" class="b" onclick="next()" disabled>Next →</button></p></div>'}
function pick(e){if(lock)return;lock=true;let x=Q[i],ok=e.dataset.v===x[3];if(ok)s++;document.querySelectorAll(".o").forEach(z=>{if(z.dataset.v===x[3])z.classList.add("good");else if(z===e)z.classList.add("bad")});document.getElementById("f").innerHTML=ok?"✅ Correct!":"💡 Look for <b>"+x[0]+"</b>. The answer is <b>"+x[3]+"</b>.";document.getElementById("n").disabled=false}
function next(){i++;if(i<Q.length)show();else partIntro()}
function partIntro(){totalScore=s;A.innerHTML='<div class="c" style="text-align:center"><div class="h">Part 1 Complete!</div><p class="sub">Now reverse your thinking.</p><p class="q">What meaning clue does each radical give?</p><button class="b" onclick="start2()">Start Part 2</button></div>'}
function start2(){part=2;i=0;s=0;show2()}
function show2(){lock=false;let x=M[i],o=sh(x[2]);A.innerHTML='<div class="c"><b>Part 2 — Radical Meanings　Question '+(i+1)+' / '+M.length+'　Score: '+s+'/'+i+'</b><div class="q">What is <b>'+x[0]+'</b> most often connected with?</div><div class="rad">'+x[0]+'</div><div class="opts">'+o.map(v=>'<button class="o" data-v="'+v+'" onclick="pick2(this)">'+v+'</button>').join("")+'</div><div id="f" class="fb">Choose the best meaning clue.</div><p style="text-align:right"><button id="n" class="b" onclick="next2()" disabled>Next →</button></p></div>'}
function pick2(e){if(lock)return;lock=true;let x=M[i],ok=e.dataset.v===x[1];if(ok)s++;document.querySelectorAll(".o").forEach(z=>{if(z.dataset.v===x[1])z.classList.add("good");else if(z===e)z.classList.add("bad")});document.getElementById("f").innerHTML=ok?"✅ Correct! <b>"+x[0]+"</b> is connected with <b>"+x[1]+"</b>.":"💡 The best meaning clue is <b>"+x[1]+"</b>.";document.getElementById("n").disabled=false}
function next2(){i++;if(i<M.length)show2();else finish()}
function finish(){const finalCorrect=totalScore+s,totalQ=Q.length+M.length;A.innerHTML='<div class="c" style="text-align:center"><div class="h">Mission Complete!</div><p class="sub">Part 1: <b>'+totalScore+'/'+Q.length+'</b><br>Part 2: <b>'+s+'/'+M.length+'</b><br>Total: <b>'+finalCorrect+'/'+totalQ+'</b></p><p>Radicals give meaning clues — not always the complete meaning.</p><button class="b" onclick="start()">Play Again</button><br><button class="submit-result-btn" id="submitResult">Submit result to Mr. Li</button><div class="submit-status" id="submitMsg"></div></div>';document.getElementById("submitResult").onclick=()=>sendStudentResult({totalQuestions:totalQ,correct:finalCorrect,totalAttempts:totalQ,meaningsReviewed:"Yes"},document.getElementById("submitResult"),document.getElementById("submitMsg"))}
intro();
</script><script>
const RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxfFi4GnZp_uFTdR16jCefO8D1cRzz0hBO-C5ACpM8GPMN3k2M3tRWYL3Eckgjf7sUr/exec";
const GAME_NAME="Radical Detective 1.0";
let studentProfile=null, activityStartedAt=Date.now();
(function(){
 const saved=JSON.parse(localStorage.getItem("hanziStudentProfile")||"null");
 if(saved){document.getElementById("studentName").value=saved.nickname||"";document.getElementById("studentClass").value=saved.className||"";}
 document.getElementById("studentStart").onclick=()=>{
  const nickname=document.getElementById("studentName").value.trim(),className=document.getElementById("studentClass").value;
  if(!nickname||!className){document.getElementById("studentError").textContent="Please enter your name and choose your class.";return;}
  studentProfile={nickname,className};localStorage.setItem("hanziStudentProfile",JSON.stringify(studentProfile));activityStartedAt=Date.now();document.getElementById("studentModal").style.display="none";
 };
})();
async function sendStudentResult(metrics,btn,msg){
 if(!studentProfile){msg.textContent="Name and class are missing.";return;}
 btn.disabled=true;msg.textContent="Submitting…";
 const total=Number(metrics.totalQuestions||0), correct=Number(metrics.correct||0);
 const result={submittedAt:new Date().toISOString(),className:studentProfile.className,nickname:studentProfile.nickname,completed:"Yes",durationMinutes:Math.max(1,Math.round((Date.now()-activityStartedAt)/60000)),totalQuestions:total,firstTryCorrect:correct,firstTryRate:total?correct/total:0,totalAttempts:Number(metrics.totalAttempts||total),extraAttempts:Math.max(0,Number(metrics.totalAttempts||total)-total),meaningsReviewed:metrics.meaningsReviewed||"",buildFirstTryRate:metrics.buildFirstTryRate||"",strokeOrderFirstTryRate:metrics.strokeOrderFirstTryRate||"",mixedChallengeFirstTryRate:metrics.mixedChallengeFirstTryRate||"",hardestItems:metrics.hardestItems||"",gameVersion:GAME_NAME,submissionId:(globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random().toString(16).slice(2))};
 try{await fetch(RESULTS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(result)});msg.textContent="Result submitted to Mr. Li.";btn.textContent="Submitted";}
 catch(e){msg.textContent="Submission did not work. Please tell Mr. Li.";btn.disabled=false;}
}
</script></body></html>
