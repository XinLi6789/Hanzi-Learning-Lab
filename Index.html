<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Radical Detective: Find the Meaning Clue</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#15233b;--muted:#607089;--line:#dfe5ee;--accent:#3859a8;--good:#218c5b;--bad:#c54a4a;--gold:#d99000}
*{box-sizing:border-box} body{margin:0;font-family:Inter,"Noto Sans",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.title{font-size:clamp(28px,4vw,48px);font-weight:900;margin:0}.sub{font-size:18px;color:var(--muted);margin:7px 0 0}.score{background:white;border:1px solid var(--line);border-radius:18px;padding:12px 18px;font-weight:800;white-space:nowrap}.bar{height:12px;background:#e6eaf1;border-radius:99px;margin:22px 0;overflow:hidden}.bar>div{height:100%;background:var(--accent);width:0;transition:.3s}.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 8px 25px rgba(25,40,70,.06)}
.badge{display:inline-block;padding:7px 12px;border-radius:99px;background:#eef2ff;color:#304c96;font-weight:800}.prompt{font-size:24px;font-weight:800;margin:18px 0 8px}.radical{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:78px;font-weight:700;line-height:1}.meaning{font-size:24px;font-weight:900}.hint{font-size:17px;color:var(--muted);margin-top:8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}.choice{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;text-align:left;transition:.15s;min-height:118px}.choice:hover{transform:translateY(-2px);border-color:#9baad1}.hanzi{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:44px;font-weight:700}.eng{font-size:17px;color:var(--muted);margin-top:5px}.choice.correct{border-color:var(--good);background:#effaf4}.choice.wrong{border-color:var(--bad);background:#fff2f2}.feedback{min-height:74px;margin-top:18px;padding:15px 18px;border-radius:16px;background:#f4f6fa;font-size:18px;line-height:1.45}.actions{display:flex;justify-content:flex-end;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 20px;font-size:17px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.start{text-align:center;padding:28px}.start h2{font-size:32px;margin:5px}.start p{font-size:18px;color:var(--muted);line-height:1.55;max-width:700px;margin:12px auto 22px}.families{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px}.pill{background:#f0f3f8;padding:7px 11px;border-radius:99px;font-weight:700}.end{text-align:center}.end .big{font-size:64px;font-weight:900;color:var(--gold)}
@media(max-width:700px){.app{padding:14px}.top{align-items:flex-start;flex-direction:column}.choices{grid-template-columns:1fr}.panel{padding:20px}.radical{font-size:64px}}
</style>
</head>
<body><main class="app">
<div class="top"><div><h1 class="title">🔎 Radical Detective</h1><p class="sub">Find the meaning clue hidden inside the character.</p></div><div class="score" id="score">Score: 0 / 0</div></div>
<div class="bar"><div id="progress"></div></div>
<section class="panel" id="game"></section>
</main>
<script>
const families = [
 {r:'亻',name:'person radical',meaning:'PEOPLE',clue:'often connected with people', examples:[['你','you'],['他','he'],['们','plural marker']]},
 {r:'口',name:'mouth radical',meaning:'MOUTH / SPEAKING',clue:'often connected with the mouth, eating, drinking or speaking', examples:[['吃','eat'],['喝','drink'],['唱','sing'],['吗','question particle']]},
 {r:'扌',name:'hand radical',meaning:'HAND / ACTION',clue:'often connected with actions done by hand', examples:[['打','hit / play'],['拉','pull'],['找','look for']]},
 {r:'女',name:'woman radical',meaning:'FEMALE / FAMILY',clue:'often connected with women or female family members', examples:[['妈','mom'],['她','she'],['姐','older sister']]},
 {r:'讠',name:'speech radical',meaning:'SPEECH / LANGUAGE',clue:'often connected with speaking, words or language', examples:[['说','say / speak'],['话','speech / words'],['语','language']]},
 {r:'氵',name:'water radical',meaning:'WATER',clue:'often connected with water or liquids', examples:[['河','river'],['海','sea'],['洗','wash']]},
 {r:'艹',name:'grass radical',meaning:'PLANTS',clue:'often connected with plants or grass', examples:[['花','flower'],['草','grass'],['茶','tea']]},
 {r:'雨',name:'rain radical',meaning:'WEATHER',clue:'often connected with rain or weather', examples:[['雪','snow'],['雷','thunder'],['雾','fog']]},
 {r:'木',name:'wood radical',meaning:'TREES / WOOD',clue:'often connected with trees or wood', examples:[['林','forest'],['森','dense forest'],['树','tree']]},
 {r:'日',name:'sun radical',meaning:'SUN / DAY / TIME',clue:'often connected with the sun, day, light or time', examples:[['明','bright'],['晴','clear / sunny'],['春','spring']]},
 {r:'月',name:'body component (肉月旁)',meaning:'BODY',clue:'in many body characters, this shape comes from 肉 (flesh)', examples:[['脸','face'],['腿','leg'],['脚','foot']]},
 {r:'宀',name:'roof radical',meaning:'HOME / ROOF',clue:'often connected with a house, room or shelter', examples:[['家','home'],['室','room'],['安','safe / peaceful']]},
 {r:'门',name:'door radical',meaning:'DOOR / SPACE',clue:'often connected with doors, rooms or enclosed spaces', examples:[['问','ask'],['间','room / between'],['闻','hear / smell']]},
 {r:'目',name:'eye radical',meaning:'EYES / SEEING',clue:'often connected with eyes or seeing', examples:[['眼','eye'],['睛','eyeball / eye'],['盯','stare']]},
 {r:'衤',name:'clothing radical',meaning:'CLOTHING',clue:'often connected with clothes or dressing', examples:[['衬','lining; in 衬衫 shirt'],['裤','trousers'],['袖','sleeve']]},
 {r:'礻',name:'spirit radical',meaning:'RITUAL / BLESSING',clue:'often connected with ritual, worship or blessing', examples:[['礼','ritual / courtesy'],['祝','wish / bless'],['福','good fortune']]},
 {r:'纟',name:'silk radical',meaning:'THREAD / TEXTILE',clue:'often connected with thread, silk, textiles or connection', examples:[['红','red'],['线','line / thread'],['纸','paper']]}
];
let questions=[]; let i=0, correct=0, answered=false;
const $=s=>document.querySelector(s);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuestions(){
 let q=[];
 families.forEach(f=>{
   const right=f.examples[Math.floor(Math.random()*f.examples.length)];
   const wrong=shuffle(families.filter(x=>x!==f)).slice(0,3).map(x=>x.examples[Math.floor(Math.random()*x.examples.length)]);
   q.push({type:'find',f,right,opts:shuffle([right,...wrong])});
 });
 return shuffle(q).slice(0,12);
}
function start(){questions=makeQuestions();i=0;correct=0;render()}
function intro(){
 $('#game').innerHTML=`<div class="start"><span class="badge">MIDDLE SCHOOL • ENGLISH INSTRUCTIONS</span><h2>Can radicals help you guess meaning?</h2><p>A radical is a reusable part of a Chinese character. It can give you a <b>meaning clue</b>—but it does not always tell you the complete meaning.</p><div class="families">${families.slice(0,9).map(f=>`<span class="pill"><b>${f.r}</b> ${f.meaning}</span>`).join('')}</div><button class="btn" onclick="start()">Start Game</button></div>`;
 $('#score').textContent='Score: 0 / 0'; $('#progress').style.width='0%';
}
function render(){answered=false; const q=questions[i]; $('#progress').style.width=`${i/questions.length*100}%`; $('#score').textContent=`Score: ${correct} / ${i}`;
 $('#game').innerHTML=`<span class="badge">Question ${i+1} of ${questions.length}</span><div class="prompt">Which character is most likely related to this meaning clue?</div><div style="display:flex;gap:22px;align-items:center;margin-top:18px"><div class="radical">${q.f.r}</div><div><div class="meaning">${q.f.meaning}</div><div class="hint">${q.f.name} • ${q.f.clue}</div></div></div><div class="choices">${q.opts.map((o,n)=>`<button class="choice" onclick="pick(${n})"><div class="hanzi">${o[0]}</div><div class="eng">${o[1]}</div></button>`).join('')}</div><div class="feedback" id="fb">Choose one character. Use the radical as your evidence.</div><div class="actions"><button class="btn" id="next" onclick="next()" disabled>Next →</button></div>`;
}
function pick(n){if(answered)return;answered=true; const q=questions[i], picked=q.opts[n], ok=picked[0]===q.right[0]; if(ok)correct++;
 document.querySelectorAll('.choice').forEach((b,j)=>{if(q.opts[j][0]===q.right[0])b.classList.add('correct'); else if(j===n)b.classList.add('wrong')});
 $('#fb').innerHTML= ok ? `✅ <b>Correct!</b> <span class="hanzi" style="font-size:28px">${q.right[0]}</span> contains <b>${q.f.r}</b>. This gives a clue about <b>${q.f.meaning.toLowerCase()}</b>.` : `💡 <b>Good try.</b> Look for <b>${q.f.r}</b>. The answer is <span class="hanzi" style="font-size:28px">${q.right[0]}</span> (${q.right[1]}). The radical gives us a meaning clue.`;
 $('#next').disabled=false; $('#score').textContent=`Score: ${correct} / ${i+1}`;
}
function next(){i++; if(i>=questions.length)return finish(); render()}
function finish(){ $('#progress').style.width='100%'; $('#game').innerHTML=`<div class="end"><span class="badge">MISSION COMPLETE</span><div class="big">${correct}/${questions.length}</div><h2>Radical Detective!</h2><p class="sub">Remember: a radical gives a <b>clue</b>, not the complete meaning.</p><p style="font-size:21px"><b>Look → Find the radical → Think about its meaning → Make a smart guess</b></p><button class="btn" onclick="start()">Play Again</button></div>` }
intro();
</script></body></html>
