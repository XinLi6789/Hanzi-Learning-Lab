<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanzi Visual Lab</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f6f8fc;color:#17243d;font-family:Arial,"Noto Sans SC",sans-serif}
.wrap{max-width:960px;margin:auto;padding:24px}.top a{text-decoration:none;color:#3859a8;font-weight:700}
.hero{text-align:center;margin:16px 0 22px}.hero h1{font-size:42px;margin:8px}.hero p{color:#66758d;font-size:18px}
.progress{height:9px;background:#e7ebf3;border-radius:10px;overflow:hidden;margin:16px 0 22px}.bar{height:100%;background:#3859a8;transition:.25s}
.card{background:#fff;border:1px solid #dde3ed;border-radius:24px;padding:28px;min-height:430px;box-shadow:0 8px 24px rgba(31,48,80,.06)}
.kicker{font-size:13px;letter-spacing:.08em;color:#718099;font-weight:800}.title{font-size:30px;margin:8px 0}.sub{color:#66758d;font-size:17px}
.hanzi{font-size:56px;font-weight:800;text-align:center;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{border:1px solid #dde3ed;border-radius:16px;padding:16px;text-align:center}.hz{font-size:36px;font-weight:800}
.note{background:#fff7df;border-radius:14px;padding:14px;margin:14px 0}.question{border-top:1px solid #e7eaf0;margin-top:18px;padding-top:18px}
.question h3{font-size:18px}.opts{display:flex;gap:9px;flex-wrap:wrap}.opt{background:#fff;border:1px solid #cbd4e2;border-radius:11px;padding:10px 14px;font-size:17px;font-weight:700;cursor:pointer}
.opt:hover{border-color:#3859a8}.opt.correct{background:#edf8f0;border:2px solid #4d9865}.opt.wrong{background:#fff0f0;border:2px solid #c96b6b}
.feedback{display:none;margin-top:10px;font-weight:700}.feedback.show{display:block}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.gate{text-align:right;margin-top:9px;color:#9a5b16;font-weight:700;font-size:14px}.primary{background:#3859a8;color:#fff}.secondary{background:#e9edf5;color:#253754}
.rule{font-size:28px;text-align:center;font-weight:800;margin:18px}.cn{text-align:center;color:#66758d;font-weight:700}.pool{font-size:25px;line-height:1.8;text-align:center}
@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.card{padding:20px}.hanzi{font-size:48px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">← Hanzi Learning Lab</a></div>
<div class="hero"><h1>🧠 Hanzi Visual Lab</h1><p>See the parts. Notice the pattern. Predict how Hanzi works.</p></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<main class="card" id="card"></main>
<div class="controls"><button class="btn secondary" id="back">← Back</button><button class="btn primary" id="next">Next →</button></div><div class="gate" id="gate"></div>
</div>
<script>
const slides = [
{t:"Building Blocks",s:"Hanzi works like LEGO",big:"亻 + 木 → 休",body:`<div class="grid">
<div class="box"><div class="hz">你</div><b>亻 + 尔</b><p>parts build one character</p></div>
<div class="box"><div class="hz">她</div><b>女 + 也</b><p>same structure, different clue</p></div>
<div class="box"><div class="hz">校</div><b>木 + 交</b><p>finish one component, then the next</p></div></div>
<div class="note"><b>Big idea:</b> Chinese characters are not random pictures. They are built from reusable parts.</div>`},
{t:"Meaning Clues",s:"A radical gives a clue — not the whole meaning",big:"氵　口　扌　衤",body:`<div class="grid">
<div class="box"><div class="hz">氵</div><b>Water</b><p>河 · 海 · 洗</p></div>
<div class="box"><div class="hz">口</div><b>Mouth / speaking</b><p>吃 · 喝 · 唱</p></div>
<div class="box"><div class="hz">衤</div><b>Clothing</b><p>衬 · 裤 · 袖</p></div></div>`},
{t:"Build Words",s:"Known characters can combine to make words",big:"学 → 学生 · 学校 · 同学",body:`<div class="grid">
<div class="box"><div class="hz">中国</div><p>China</p></div><div class="box"><div class="hz">生日</div><p>birthday</p></div><div class="box"><div class="hz">水果</div><p>fruit</p></div></div>`},

{t:"Writing Lab 1/7",s:"Top → Bottom",big:"从上到下",body:`
<div class="rule">三　→　学　→　岁</div><div class="cn">When parts are stacked, start higher and move downward.</div>
${q("Which character has a TOP → BOTTOM structure?",["喜","你","红"],0,"✓ 喜")}
${q("In 岁, which part is higher?",["山","夕"],0,"✓ 山")}
${q("Which character is NOT mainly top-bottom?",["她","学","爸"],0,"✓ 她 is mainly left-right.")}`},

{t:"Writing Lab 2/7",s:"Left → Right",big:"从左到右",body:`
<div class="rule">你 = 亻 + 尔　　校 = 木 + 交</div><div class="cn">Finish the left component before moving to the right.</div>
${q("Which character has a LEFT → RIGHT structure?",["红","岁","学"],0,"✓ 红 = 纟 + 工")}
${q("Which component comes first in 她?",["女","也"],0,"✓ 女")}
${q("Which pair are BOTH left-right characters?",["住 + 课","哥 + 岁","国 + 喜"],0,"✓ 住 + 课")}`},

{t:"Writing Lab 3/7",s:"Horizontal → Vertical",big:"先横后竖",body:`
<div class="rule">十 = 一 → 丨</div><div class="cn">When horizontal and vertical strokes cross, horizontal commonly comes first.</div>
${q("Which stroke comes first in 十?",["一","丨"],0,"✓ 一")}
${q("Which rule helps with crossing strokes in 车?",["Horizontal → Vertical","Outside → Inside"],0,"✓ Horizontal → Vertical")}
${q("Which familiar character also contains crossing horizontal and vertical strokes?",["去","她","问"],0,"✓ 去")}`},

{t:"Writing Lab 4/7",s:"Left-falling → Right-falling",big:"先撇后捺",body:`
<div class="rule">人 = 丿 → ㇏　　大 · 天</div><div class="cn">When 撇 and 捺 form a pair, 撇 commonly comes first.</div>
${q("Which stroke comes first in 人?",["丿","㇏"],0,"✓ 丿")}
${q("In 大, which stroke comes first?",["横","撇","捺"],0,"✓ 横")}
${q("In 天, which stroke comes first?",["横","撇","捺"],0,"✓ 横")}`},

{t:"Writing Lab 5/7",s:"Outside → Inside",big:"先外后内",body:`
<div class="rule">问 = 门 → 口</div><div class="cn">Begin the enclosing structure before writing the inside.</div>
${q("Transfer the rule to 国. What do you begin before 玉?",["Outer frame","玉"],0,"✓ Outer frame")}
${q("Which character has an enclosing structure?",["国","校","红"],0,"✓ 国")}
${q("Which character is NOT left-right?",["国","你","她"],0,"✓ 国")}`},

{t:"Writing Lab 6/7",s:"LEGO Rule — Finish One Component",big:"部件写完整",body:`
<div class="rule">你：亻 → 尔　　红：纟 → 工</div><div class="cn">A useful writing strategy: finish one building block before starting the next.</div>
${q("Which component do you finish first in 住?",["亻","主"],0,"✓ 亻")}
${q("Which component do you finish first in 课?",["讠","果"],0,"✓ 讠")}
${q("Which component do you finish first in 欢?",["又","欠"],0,"✓ 又")}`},

{t:"Writing Lab 7/7",s:"Mixed Hanzi Challenge",big:"🏆",body:`
${q("学 — Which structure helps most?",["Top → Bottom","Left → Right","Outside → Inside"],0,"✓ Top → Bottom")}
${q("国 — Which rule helps most?",["Outside → Inside","Left → Right","撇 → 捺"],0,"✓ Outside → Inside")}
${q("泰 — Which TWO ideas can help?",["Top → Bottom + 撇 before 捺","Left → Right","Outside → Inside"],0,"✓ Top → Bottom + 撇 before 捺")}
${q("红 — Which component is completed first?",["纟","工"],0,"✓ 纟")}
${q("叫 — How is the character mainly built?",["Left → Right","Top → Bottom","Enclosed"],0,"✓ Left → Right")}
${q("爸 — Which description fits best?",["Top → Bottom","Left → Right","Outside → Inside"],0,"✓ Top → Bottom")}
${q("谢 — Which component is on the left?",["讠","身","寸"],0,"✓ 讠")}
${q("我 — Does one simple structure rule explain the whole character?",["No — use patterns, then check stroke order","Yes — Left → Right only","Yes — Outside → Inside"],0,"✓ Correct. Patterns help us predict; they do not replace checking every new character.")}
<div class="note"><b>Core characters:</b><div class="pool">学 · 国 · 泰 · 天 · 我 · 叫 · 大 · 岁 · 去 · 过 · 红 · 你 · 她 · 爸 · 弟 · 哥 · 校 · 住 · 再 · 见 · 谢 · 喜 · 欢 · 车 · 美 · 课</div></div>`},

{t:"Character Detective",s:"Use clues to investigate an unfamiliar Hanzi",big:"湖",body:`
<div class="box"><div class="hz">湖</div><p><b>1.</b> Find a familiar part → 氵</p><p><b>2.</b> Recall its clue → WATER</p><p><b>3.</b> Predict the meaning category</p><p><b>4.</b> Check → 湖 means <b>lake</b>.</p></div>
<div class="note"><b>Final idea:</b> SEE → BREAK INTO PARTS → NOTICE STRUCTURE → PREDICT → CHECK → WRITE</div>`}
];

function q(text,opts,correct,feedback){
 let buttons=opts.map((o,i)=>`<button class="opt" data-ok="${i===correct?1:0}">${o}</button>`).join("");
 return `<div class="question"><h3>${text}</h3><div class="opts">${buttons}</div><div class="feedback">${feedback}</div></div>`;
}
let i=0;
const answered=slides.map(()=>new Set());
const card=document.getElementById("card"),bar=document.getElementById("bar"),back=document.getElementById("back"),next=document.getElementById("next"),gate=document.getElementById("gate");

function updateGate(){
 const questions=[...card.querySelectorAll(".question")];
 const needsAnswers=questions.length>0;
 const complete=!needsAnswers || answered[i].size===questions.length;
 next.disabled=!complete;
 gate.textContent=!complete ? `Answer all ${questions.length} question${questions.length>1?"s":""} before continuing. (${answered[i].size}/${questions.length})` : "";
}

function render(){
 const x=slides[i];
 card.innerHTML=`<div class="kicker">STAGE ${i+1} OF ${slides.length}</div><div class="title">${x.t}</div><div class="sub">${x.s}</div><div class="hanzi">${x.big}</div>${x.body}`;
 bar.style.width=((i+1)/slides.length*100)+"%";
 back.disabled=i===0;
 next.textContent=i===slides.length-1?"Start Again ↻":"Next →";
 const questions=[...card.querySelectorAll(".question")];
 questions.forEach((question,qi)=>{
   question.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
     question.querySelectorAll(".opt").forEach(b=>b.classList.remove("correct","wrong"));
     btn.classList.add(btn.dataset.ok==="1"?"correct":"wrong");
     question.querySelector(".feedback").classList.add("show");
     answered[i].add(qi);
     updateGate();
   });
 });
 updateGate();
 window.scrollTo({top:0,behavior:"smooth"});
}
back.onclick=()=>{if(i>0){i--;render()}};
next.onclick=()=>{
 if(next.disabled)return;
 i=i===slides.length-1?0:i+1;
 render();
};
render();
</script>
</body></html>
