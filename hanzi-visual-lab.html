<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Li's Hanzi Learning Lab — Hanzi Visual Lab</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f6f8fc;color:#17243d;font-family:Arial,"Noto Sans SC",sans-serif}
.wrap{max-width:960px;margin:auto;padding:24px}.top a{text-decoration:none;color:#3859a8;font-weight:700}
.hero{text-align:center;margin:16px 0 22px}.hero h1{font-size:42px;margin:8px}.hero p{color:#66758d;font-size:18px}
.progress{height:9px;background:#e7ebf3;border-radius:10px;overflow:hidden;margin:16px 0 22px}.bar{height:100%;background:#3859a8;transition:.25s}
.card{background:#fff;border:1px solid #dde3ed;border-radius:24px;padding:28px;min-height:430px;box-shadow:0 8px 24px rgba(31,48,80,.06)}
.kicker{font-size:13px;letter-spacing:.08em;color:#718099;font-weight:800}.title{font-size:30px;margin:8px 0}.sub{color:#66758d;font-size:17px}
.hanzi{font-size:56px;font-weight:800;text-align:center;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{border:1px solid #dde3ed;border-radius:16px;padding:16px;text-align:center}.hz{font-size:36px;font-weight:800}
.note{background:#fff7df;border-radius:14px;padding:14px;margin:14px 0}.question{border-top:1px solid #e7eaf0;margin-top:18px;padding-top:18px}
.question h3{font-size:18px}.opts{display:flex;gap:9px;flex-wrap:wrap}.opt{background:#fff;border:1px solid #cbd4e2;border-radius:11px;padding:10px 14px;font-size:17px;font-weight:700;cursor:pointer}
.opt:hover{border-color:#3859a8}.opt.correct{background:#edf8f0;border:2px solid #4d9865}.opt.wrong{background:#fff0f0;border:2px solid #c96b6b}
.feedback{display:none;margin-top:10px;font-weight:700}.feedback.show{display:block}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.gate{text-align:right;margin-top:9px;color:#9a5b16;font-weight:700;font-size:14px}.primary{background:#3859a8;color:#fff}.secondary{background:#e9edf5;color:#253754}
.rule{font-size:28px;text-align:center;font-weight:800;margin:18px}.cn{text-align:center;color:#66758d;font-weight:700}.pool{font-size:25px;line-height:1.8;text-align:center}
@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.card{padding:20px}.hanzi{font-size:48px}}
</style>
<style>
.student-modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.student-box{background:#fff;border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}.student-box h2{margin-top:0}.student-box label{display:block;font-weight:800;margin:12px 0 5px}.student-box input,.student-box select{width:100%;box-sizing:border-box;padding:12px;border:2px solid #cbd5e1;border-radius:10px;font:inherit}.student-box button,.submit-result-btn{margin-top:16px;border:0;border-radius:12px;padding:12px 18px;background:#1d4ed8;color:#fff;font-weight:800;cursor:pointer}.submit-result-btn:disabled{opacity:.55}.submit-status{margin-top:10px;font-weight:700}
</style></head>
<body><div class="student-modal" id="studentModal"><div class="student-box"><h2>Student Information</h2><p>Enter your name and class before starting.</p><label for="studentName">Name</label><input id="studentName" maxlength="24" autocomplete="name"><label for="studentClass">Class</label><select id="studentClass"><option value="">Choose class</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>IB DP1</option><option>Other</option></select><button id="studentStart">Start Activity</button><div class="submit-status" id="studentError"></div></div></div>
<div class="wrap">
<div class="top"><a href="index.html">← Hanzi Learning Lab</a></div>
<div class="hero"><h1>🧠 Hanzi Visual Lab</h1><p>See the parts. Notice the pattern. Predict how Hanzi works.</p></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<main class="card" id="card"></main>
<div class="controls"><button class="btn secondary" id="back">← Back</button><button class="btn primary" id="next">Next →</button></div><div class="gate" id="gate"></div>
</div>
<script>
const slides = [
{t:"Building Blocks",s:"Hanzi works like LEGO",big:"亻 + 木 → 休",body:`<div class="grid">
<div class="box"><div class="hz">你</div><b>亻 + 尔</b><p>parts build one character</p></div>
<div class="box"><div class="hz">她</div><b>女 + 也</b><p>same structure, different clue</p></div>
<div class="box"><div class="hz">校</div><b>木 + 交</b><p>finish one component, then the next</p></div></div>
<div class="note"><b>Big idea:</b> Chinese characters are not random pictures. They are built from reusable parts.</div>`},
{t:"From Hanzi to Components",s:"Some familiar Hanzi change shape when they become components",big:"人 → 亻　手 → 扌　水 → 氵",body:`
<div class="note"><b>Notice:</b> Some Hanzi keep the same shape as a component. Others change shape to fit inside a new character.</div>
<div class="grid">
<div class="box"><div class="hz">人 → 亻</div><p>person → person component</p></div>
<div class="box"><div class="hz">手 → 扌</div><p>hand → hand component</p></div>
<div class="box"><div class="hz">水 → 氵</div><p>water → water component</p></div>
<div class="box"><div class="hz">足 → ⻊</div><p>foot → foot component</p></div>
<div class="box"><div class="hz">火 → 灬</div><p>fire → fire component</p></div>
<div class="box"><div class="hz">口 → 口</div><p>mouth → mouth component</p></div>
<div class="box"><div class="hz">木 → 木</div><p>tree → tree component</p></div>
<div class="box"><div class="hz">目 → 目</div><p>eye → eye component</p></div>
<div class="box"><div class="hz">女 → 女</div><p>woman → female component</p></div>
</div>
${q("Match 人 (rén) with its common component form.",["亻","扌","氵","⻊"],0,"✓ 人 → 亻")}
${q("Match 手 (shǒu) with its common component form.",["扌","亻","灬","氵"],0,"✓ 手 → 扌")}
${q("Match 水 (shuǐ) with its common component form.",["氵","灬","⻊","亻"],0,"✓ 水 → 氵")}
${q("Match 足 (zú) with its common component form.",["⻊","扌","氵","灬"],0,"✓ 足 → ⻊")}
${q("Match 火 (huǒ) with this common component form.",["灬","氵","扌","亻"],0,"✓ 火 → 灬")}
${q("Which one often keeps the SAME shape as a component?",["口","手 → 扌","水 → 氵","人 → 亻"],0,"✓ 口 often stays 口. 木, 目, and 女 can also keep their basic shape.")}
`},
{t:"Meaning Clues",s:"The same 17 radical clues as your classroom poster",big:"17 RADICAL CLUES",body:`<div class="grid">
<div class="box"><div class="hz">亻</div><b>PEOPLE</b><p>你 · 他 · 们</p></div>
<div class="box"><div class="hz">口</div><b>MOUTH</b><p>吃 · 喝 · 唱</p></div>
<div class="box"><div class="hz">扌</div><b>HAND / ACTION</b><p>打 · 拉 · 找</p></div>
<div class="box"><div class="hz">女</div><b>WOMAN / FEMALE</b><p>妈 · 她 · 姐</p></div>
<div class="box"><div class="hz">讠</div><b>SPEECH / LANGUAGE</b><p>说 · 话 · 语</p></div>
<div class="box"><div class="hz">氵</div><b>WATER</b><p>河 · 海 · 洗</p></div>
<div class="box"><div class="hz">艹</div><b>PLANTS / GRASS</b><p>花 · 草 · 茶</p></div>
<div class="box"><div class="hz">雨</div><b>RAIN / WEATHER</b><p>雨 · 雪 · 雷</p></div>
<div class="box"><div class="hz">木</div><b>TREES / WOOD</b><p>树 · 林 · 森</p></div>
<div class="box"><div class="hz">目</div><b>EYES / SEEING</b><p>看 · 眼 · 睛</p></div>
<div class="box"><div class="hz">日</div><b>SUN / DAY / TIME</b><p>明 · 晴 · 春</p></div>
<div class="box"><div class="hz">月</div><b>BODY</b><p>脸 · 腿 · 胖</p></div>
<div class="box"><div class="hz">宀</div><b>HOUSE / ROOF</b><p>家 · 室 · 安</p></div>
<div class="box"><div class="hz">门</div><b>DOOR / ENTRANCE</b><p>门 · 问 · 间</p></div>
<div class="box"><div class="hz">衤</div><b>CLOTHES / CLOTHING</b><p>衬 · 裤 · 袖</p></div>
<div class="box"><div class="hz">礻</div><b>SPIRITUAL / RELIGION</b><p>神 · 祝 · 福</p></div>
<div class="box"><div class="hz">纟</div><b>THREAD / SILK</b><p>线 · 绳 · 红</p></div>
</div>
<div class="note"><b>Remember:</b> A radical gives a meaning clue. It does not tell you the whole meaning of the character.</div>
${q("Which radical is most connected with RAIN / WEATHER?",["雨","门","木","口"],0,"✓ 雨 (yǔ) — rain / weather")}
${q("Which radical is most connected with DOOR / ENTRANCE?",["门","雨","氵","女"],0,"✓ 门 (mén) — door / entrance")}
`},
{t:"Build Words",s:"Known characters can combine to make words",big:"学 → 学生 · 学校 · 同学",body:`<div class="grid">
<div class="box"><div class="hz">中国</div><div class="cn">Zhōngguó</div><p>China</p></div><div class="box"><div class="hz">生日</div><div class="cn">shēngrì</div><p>birthday</p></div><div class="box"><div class="hz">水果</div><div class="cn">shuǐguǒ</div><p>fruit</p></div></div>`},

{t:"Writing Lab 1/7",s:"Top → Bottom",big:"从上到下",body:`
<div class="rule">三　→　学　→　岁</div><div class="cn">When parts are stacked, start higher and move downward.</div>
${q("Which character has a TOP → BOTTOM structure?",["喜","你","红"],0,"✓ 喜")}
${q("In 岁, which part is higher?",["山","夕"],0,"✓ 山")}
${q("Which character is NOT mainly top-bottom?",["她","学","爸"],0,"✓ 她 is mainly left-right.")}`},

{t:"Writing Lab 2/7",s:"Left → Right",big:"从左到右",body:`
<div class="rule">你 = 亻 + 尔　　校 = 木 + 交</div><div class="cn">Finish the left component before moving to the right.</div>
${q("Which character has a LEFT → RIGHT structure?",["红","岁","学"],0,"✓ 红 = 纟 + 工")}
${q("Which component comes first in 她?",["女","也"],0,"✓ 女")}
${q("Which pair are BOTH left-right characters?",["住 + 课","哥 + 岁","国 + 喜"],0,"✓ 住 + 课")}`},

{t:"Writing Lab 3/7",s:"Horizontal → Vertical",big:"先横后竖",body:`
<div class="rule">十 = 一 → 丨</div><div class="cn">横 (héng) = horizontal　·　竖 (shù) = vertical</div><div class="cn">When horizontal and vertical strokes cross, horizontal commonly comes first.</div>
${q("Which stroke comes first in 十?",["一 (héng) — horizontal","丨 (shù) — vertical"],0,"✓ 一 (héng) — horizontal")}
${q("Which rule helps with crossing strokes in 车?",["Horizontal → Vertical","Outside → Inside"],0,"✓ Horizontal → Vertical")}
${q("Which familiar character also contains crossing horizontal and vertical strokes?",["去","她","问"],0,"✓ 去")}`},

{t:"Writing Lab 4/7",s:"Left-falling → Right-falling",big:"先撇后捺",body:`
<div class="rule">人 = 丿 → ㇏　　大 · 天</div><div class="cn">撇 (piě) = left-falling　·　捺 (nà) = right-falling　·　横 (héng) = horizontal</div><div class="cn">When 撇 and 捺 form a pair, 撇 commonly comes first.</div>
${q("Which stroke comes first in 人?",["丿 (piě) — left-falling","㇏ (nà) — right-falling"],0,"✓ 丿 (piě) — left-falling")}
${q("In 大, which stroke comes first?",["横 (héng) — horizontal","撇 (piě) — left-falling","捺 (nà) — right-falling"],0,"✓ 横 (héng) — horizontal")}
${q("In 天, which stroke comes first?",["横 (héng) — horizontal","撇 (piě) — left-falling","捺 (nà) — right-falling"],0,"✓ 横 (héng) — horizontal")}`},

{t:"Writing Lab 5/7",s:"Outside → Inside",big:"先外后内",body:`
<div class="rule">问 = 门 → 口</div><div class="cn">Begin the enclosing structure before writing the inside.</div>
${q("Transfer the rule to 国. What do you begin before 玉?",["Outer frame","玉"],0,"✓ Outer frame")}
${q("Which character has an enclosing structure?",["国","校","红"],0,"✓ 国")}
${q("Which character is NOT left-right?",["国","你","她"],0,"✓ 国")}`},

{t:"Writing Lab 6/7",s:"LEGO Rule — Finish One Component",big:"部件写完整",body:`
<div class="rule">你：亻 → 尔　　红：纟 → 工</div><div class="cn">A useful writing strategy: finish one building block before starting the next.</div>
${q("Which component do you finish first in 住?",["亻","主"],0,"✓ 亻")}
${q("Which component do you finish first in 课?",["讠","果"],0,"✓ 讠")}
${q("Which component do you finish first in 欢?",["又","欠"],0,"✓ 又")}`},

{t:"Writing Lab 7/7",s:"Mixed Hanzi Challenge",big:"🏆",body:`
${q("学 — Which structure helps most?",["Top → Bottom","Left → Right","Outside → Inside"],0,"✓ Top → Bottom")}
${q("国 — Which rule helps most?",["Outside → Inside","Left → Right","撇 → 捺"],0,"✓ Outside → Inside")}
${q("泰 — Which TWO ideas can help?",["Top → Bottom + 撇 before 捺","Left → Right","Outside → Inside"],0,"✓ Top → Bottom + 撇 before 捺")}
${q("红 — Which component is completed first?",["纟","工"],0,"✓ 纟")}
${q("叫 — How is the character mainly built?",["Left → Right","Top → Bottom","Enclosed"],0,"✓ Left → Right")}
${q("爸 — Which description fits best?",["Top → Bottom","Left → Right","Outside → Inside"],0,"✓ Top → Bottom")}
${q("谢 — Which component is on the left?",["讠","身","寸"],0,"✓ 讠")}
${q("我 — Does one simple structure rule explain the whole character?",["No — use patterns, then check stroke order","Yes — Left → Right only","Yes — Outside → Inside"],0,"✓ Correct. Patterns help us predict; they do not replace checking every new character.")}
<div class="note"><b>Core characters:</b><div class="pool">学 · 国 · 泰 · 天 · 我 · 叫 · 大 · 岁 · 去 · 过 · 红 · 你 · 她 · 爸 · 弟 · 哥 · 校 · 住 · 再 · 见 · 谢 · 喜 · 欢 · 车 · 美 · 课</div></div>`},

{t:"Character Detective",s:"Use clues to investigate an unfamiliar Hanzi",big:"湖",body:`
<div class="box"><div class="hz">湖</div><p><b>1.</b> Find a familiar part → 氵</p><p><b>2.</b> Recall its clue → WATER</p><p><b>3.</b> Predict the meaning category</p><p><b>4.</b> Check → 湖 <b>hú</b> means <b>lake</b>.</p></div>
<div class="note"><b>Final idea:</b> SEE → BREAK INTO PARTS → NOTICE STRUCTURE → PREDICT → CHECK → WRITE</div>`}
];

function q(text,opts,correct,feedback){
 const choices=opts.map((o,i)=>({text:o,ok:i===correct})).sort(()=>Math.random()-.5);
 let buttons=choices.map(x=>`<button class="opt" data-ok="${x.ok?1:0}">${x.text}</button>`).join("");
 return `<div class="question"><h3>${text}</h3><div class="opts">${buttons}</div><div class="feedback">${feedback}</div></div>`;
}
let i=0;
const answered=slides.map(()=>new Set());
const correctAnswers=slides.map(()=>new Set());
let visualAttempts=0;
const card=document.getElementById("card"),bar=document.getElementById("bar"),back=document.getElementById("back"),next=document.getElementById("next"),gate=document.getElementById("gate");

function updateGate(){
 const questions=[...card.querySelectorAll(".question")];
 const needsAnswers=questions.length>0;
 const complete=!needsAnswers || answered[i].size===questions.length;
 next.disabled=!complete;
 gate.textContent=!complete ? `Answer all ${questions.length} question${questions.length>1?"s":""} before continuing. (${answered[i].size}/${questions.length})` : "";
}

function render(){
 const x=slides[i];
 card.innerHTML=`<div class="kicker">STAGE ${i+1} OF ${slides.length}</div><div class="title">${x.t}</div><div class="sub">${x.s}</div><div class="hanzi">${x.big}</div>${x.body}`;
 bar.style.width=((i+1)/slides.length*100)+"%";
 back.disabled=i===0;
 next.textContent=i===slides.length-1?"Finish":"Next →";
 const questions=[...card.querySelectorAll(".question")];
 questions.forEach((question,qi)=>{
   question.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
     question.querySelectorAll(".opt").forEach(b=>b.classList.remove("correct","wrong"));
     visualAttempts++;btn.classList.add(btn.dataset.ok==="1"?"correct":"wrong");if(btn.dataset.ok==="1")correctAnswers[i].add(qi);
     question.querySelector(".feedback").classList.add("show");
     answered[i].add(qi);
     updateGate();
   });
 });
 updateGate();
 window.scrollTo({top:0,behavior:"smooth"});
}
back.onclick=()=>{if(i>0){i--;render()}};
next.onclick=()=>{if(next.disabled)return;if(i===slides.length-1){const totalQ=slides.reduce((n,s)=>{const d=document.createElement("div");d.innerHTML=s.body;return n+d.querySelectorAll(".question").length},0);const correct=correctAnswers.reduce((n,s)=>n+s.size,0);card.innerHTML='<div class="title">Lab Complete!</div><div class="sub">You completed the Hanzi Visual Lab.</div><div class="hanzi">✓</div><button class="submit-result-btn" id="submitResult">Submit result to Mr. Li</button><div class="submit-status" id="submitMsg"></div>';next.disabled=true;back.disabled=true;document.getElementById("submitResult").onclick=()=>sendStudentResult({totalQuestions:totalQ,correct,totalAttempts:visualAttempts,meaningsReviewed:"Yes"},document.getElementById("submitResult"),document.getElementById("submitMsg"));return;}i++;render();};
render();
</script>
<script>
const RESULTS_ENDPOINT="https://script.google.com/macros/s/AKfycbxfFi4GnZp_uFTdR16jCefO8D1cRzz0hBO-C5ACpM8GPMN3k2M3tRWYL3Eckgjf7sUr/exec";
const GAME_NAME="Hanzi Visual Lab 1.0";
let studentProfile=null, activityStartedAt=Date.now();
(function(){
 const saved=JSON.parse(localStorage.getItem("hanziStudentProfile")||"null");
 if(saved){document.getElementById("studentName").value=saved.nickname||"";document.getElementById("studentClass").value=saved.className||"";}
 document.getElementById("studentStart").onclick=()=>{
  const nickname=document.getElementById("studentName").value.trim(),className=document.getElementById("studentClass").value;
  if(!nickname||!className){document.getElementById("studentError").textContent="Please enter your name and choose your class.";return;}
  studentProfile={nickname,className};localStorage.setItem("hanziStudentProfile",JSON.stringify(studentProfile));activityStartedAt=Date.now();document.getElementById("studentModal").style.display="none";
 };
})();
async function sendStudentResult(metrics,btn,msg){
 if(!studentProfile){msg.textContent="Name and class are missing.";return;}
 btn.disabled=true;msg.textContent="Submitting…";
 const total=Number(metrics.totalQuestions||0), correct=Number(metrics.correct||0);
 const result={submittedAt:new Date().toISOString(),className:studentProfile.className,nickname:studentProfile.nickname,completed:"Yes",durationMinutes:Math.max(1,Math.round((Date.now()-activityStartedAt)/60000)),totalQuestions:total,firstTryCorrect:correct,firstTryRate:total?correct/total:0,totalAttempts:Number(metrics.totalAttempts||total),extraAttempts:Math.max(0,Number(metrics.totalAttempts||total)-total),meaningsReviewed:metrics.meaningsReviewed||"",buildFirstTryRate:metrics.buildFirstTryRate||"",strokeOrderFirstTryRate:metrics.strokeOrderFirstTryRate||"",mixedChallengeFirstTryRate:metrics.mixedChallengeFirstTryRate||"",hardestItems:metrics.hardestItems||"",gameVersion:GAME_NAME,submissionId:(globalThis.crypto?.randomUUID?.()||Date.now()+"-"+Math.random().toString(16).slice(2))};
 try{await fetch(RESULTS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(result)});msg.textContent="Result submitted to Mr. Li.";btn.textContent="Submitted";}
 catch(e){msg.textContent="Submission did not work. Please tell Mr. Li.";btn.disabled=false;}
}
</script></body></html>
