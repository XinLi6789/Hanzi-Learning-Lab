<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师后台 — Hanzi Learning Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f5f6f8;
    color: #1a1a2e;
    min-height: 100vh;
    font-size: 14px;
  }
  .topbar {
    background: linear-gradient(135deg, #1a73e8, #1557b0);
    color: #fff;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .subtitle { font-size: 12px; opacity: 0.8; }
  .topbar .refresh-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .topbar .refresh-btn:hover { background: rgba(255,255,255,0.25); }

  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    border: 1px solid #e8eaed;
  }
  .stat-card .label { font-size: 12px; color: #5f6368; font-weight: 500; margin-bottom: 2px; }
  .stat-card .value { font-size: 26px; font-weight: 700; color: #1a73e8; line-height: 1.2; }

  .toolbar {
    background: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    border: 1px solid #e8eaed;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar label { font-size: 12px; font-weight: 600; color: #3c4043; white-space: nowrap; }
  .toolbar select, .toolbar input {
    padding: 6px 10px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .toolbar select:focus, .toolbar input:focus { border-color: #1a73e8; }
  .toolbar .spacer { flex: 1; }
  .toolbar .export-btn {
    background: #1e8e3e;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .toolbar .export-btn:hover { background: #176527; }

  .table-wrapper {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    border: 1px solid #e8eaed;
  }
  .table-scroll { overflow-x: auto; max-height: 70vh; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: #f1f3f4; }
  th {
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    color: #3c4043;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: #f1f3f4;
    border-bottom: 1px solid #dadce0;
  }
  th:hover { background: #e8eaed; }
  th .sort-indicator { font-size: 9px; color: #999; margin-left: 3px; }
  td {
    padding: 6px 10px;
    border-bottom: 1px solid #f0f1f3;
    white-space: nowrap;
  }
  tbody tr:hover { background: #f8f9fa; }
  tbody tr:nth-child(even) { background: #fcfcfd; }
  tbody tr:nth-child(even):hover { background: #f8f9fa; }

  .pct-high { color: #1e8e3e; font-weight: 600; }
  .pct-mid { color: #e37400; font-weight: 600; }
  .pct-low { color: #d93025; font-weight: 600; }
  .game-tag { background: #e8f0fe; color: #1a73e8; padding: 2px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
  .completed-yes { color: #1e8e3e; }
  .completed-no { color: #d93025; }

  .status-bar { text-align: center; padding: 30px; color: #5f6368; font-size: 14px; }
  .loading { color: #1a73e8; }
  .error {
    background: #fce8e6;
    color: #d93025;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    border: 1px solid #f9d0cb;
  }
  .error .retry-link { color: #1a73e8; text-decoration: underline; cursor: pointer; margin-left: 8px; }
  .empty-state { text-align: center; padding: 40px 20px; color: #999; }
  .empty-state .icon { font-size: 36px; margin-bottom: 8px; }

  .info-bar {
    background: #e8f0fe;
    border: 1px solid #d2e3fc;
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #174ea6;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  @media (max-width: 768px) {
    .topbar { flex-direction: column; gap: 6px; text-align: center; padding: 10px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .spacer { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Mr. Li's Hanzi Lab — 教师后台</h1>
    <div class="subtitle">学生成绩管理</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">刷新数据</button>
</div>

<div class="container">

  <div class="info-bar">
    <span>📊</span>
    <span>数据来源：Google Sheets 实时读取 | 学生提交后点「刷新数据」即可看到最新记录</span>
  </div>

  <div id="errorBox" style="display:none;" class="error"></div>

  <div class="stats-grid">
    <div class="stat-card"><div class="label">总提交数</div><div class="value" id="statTotal">—</div></div>
    <div class="stat-card"><div class="label">学生人数</div><div class="value" id="statStudents">—</div></div>
    <div class="stat-card"><div class="label">班级数</div><div class="value" id="statClasses">—</div></div>
    <div class="stat-card"><div class="label">平均首次正确率</div><div class="value" id="statAvgFirstTry">—</div></div>
  </div>

  <div class="toolbar">
    <label>班级</label>
    <select id="classFilter" onchange="renderTable()">
      <option value="">全部</option>
    </select>
    <label>搜索</label>
    <input type="text" id="searchInput" placeholder="学生昵称..." oninput="renderTable()" style="width:140px;">
    <div class="spacer"></div>
    <button class="export-btn" onclick="exportCSV()">导出 CSV</button>
  </div>

  <div class="table-wrapper">
    <div class="table-scroll">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td colspan="10" class="status-bar loading">正在从 Google Sheets 加载数据...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
var SHEET_ID = '1aIfSG2ItWHQ184VVsy-jn0asXzN5A0ixpxyY2EBhOvk';
var GVIZ_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json';

var allData = [];
var sortColumn = 'Submitted At';
var sortDirection = 'desc';

// 精简列：只显示教师最关心的
var COLUMNS = [
  { key: 'Submitted At', label: '时间', sortable: true },
  { key: 'Class', label: '班级', sortable: true },
  { key: 'Nickname', label: '学生', sortable: true },
  { key: 'Game Version', label: '游戏', sortable: true, isGame: true },
  { key: 'Duration (min)', label: '用时', sortable: true, suffix: '分' },
  { key: 'First-Try %', label: '首次正确率', sortable: true, isPct: true },
  { key: 'Total Questions', label: '题数', sortable: true },
  { key: 'First-Try Correct', label: '答对', sortable: true },
  { key: 'Extra Attempts', label: '额外尝试', sortable: true },
  { key: 'Hardest Items', label: '最难题目', sortable: false }
];

// gviz 默认回调
window.google = window.google || {};
window.google.visualization = window.google.visualization || {};
window.google.visualization.Query = window.google.visualization.Query || {};
window.google.visualization.Query.setResponse = function(json) {
  parseGvizData(json);
  var s = document.getElementById('gvizScript');
  if (s) s.parentNode.removeChild(s);
};

loadData();

function loadData() {
  document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="status-bar loading">正在从 Google Sheets 加载数据...</td></tr>';
  document.getElementById('errorBox').style.display = 'none';

  var old = document.getElementById('gvizScript');
  if (old) old.parentNode.removeChild(old);

  var script = document.createElement('script');
  script.id = 'gvizScript';
  script.src = GVIZ_URL;
  script.onerror = function() {
    showError('无法连接 Google Sheets。请确认表格已设为公开可读。');
    if (script.parentNode) script.parentNode.removeChild(script);
  };
  setTimeout(function() {
    if (document.getElementById('tableBody').querySelector('.loading')) {
      if (script.parentNode) script.parentNode.removeChild(script);
      showError('加载超时。请确认表格已公开，然后点击重试。');
    }
  }, 15000);
  document.body.appendChild(script);
}

function parseGvizData(json) {
  if (json.status !== 'ok') {
    showError('Google Sheets 返回错误：' + (json.errors ? JSON.stringify(json.errors) : '未知'));
    return;
  }
  var table = json.table;
  if (!table || !table.cols || !table.rows) {
    allData = []; renderAll(); return;
  }
  var headers = table.cols.map(function(c) { return c.label || c.id; });
  allData = table.rows.map(function(row) {
    var obj = {};
    row.c.forEach(function(cell, idx) {
      obj[headers[idx]] = cell ? (cell.f != null ? cell.f : (cell.v != null ? cell.v : '')) : '';
    });
    return obj;
  });
  renderAll();
}

function renderAll() { renderStats(); renderClassFilter(); renderTableHead(); renderTable(); }

function showError(msg) {
  var b = document.getElementById('errorBox');
  b.innerHTML = msg + ' <span class="retry-link" onclick="loadData()">点击重试</span>';
  b.style.display = 'block';
  document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" class="status-bar">加载失败</td></tr>';
}

function renderStats() {
  document.getElementById('statTotal').textContent = allData.length;
  var stu = {}, cls = {}, pcts = [];
  allData.forEach(function(r) {
    stu[(r['Nickname']||'')+'|'+(r['Class']||'')] = true;
    if (r['Class']) cls[r['Class']] = 1;
    var p = parsePct(r['First-Try %']); if (p != null) pcts.push(p);
  });
  document.getElementById('statStudents').textContent = Object.keys(stu).length;
  document.getElementById('statClasses').textContent = Object.keys(cls).length;
  var avg = pcts.length ? Math.round(pcts.reduce(function(a,b){return a+b},0)/pcts.length) : 0;
  document.getElementById('statAvgFirstTry').textContent = avg + '%';
}

function parsePct(v) {

function parseDate(s) {
  // 解析 gviz 格式的日期："9/28/2026 1:27:45" 或 "10/5/2026 6:13:35"
  if (!s || typeof s !== 'string') return 0;
  var m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})[ ]?(\d{1,2})?:?(\d{1,2})?:?(\d{1,2})?/);
  if (!m) {
    // 尝试 ISO 格式
    var d = new Date(s).getTime();
    return isNaN(d) ? 0 : d;
  }
  var month = parseInt(m[1]) - 1;
  var day = parseInt(m[2]);
  var year = parseInt(m[3]);
  var hour = m[4] ? parseInt(m[4]) : 0;
  var min = m[5] ? parseInt(m[5]) : 0;
  var sec = m[6] ? parseInt(m[6]) : 0;
  return new Date(year, month, day, hour, min, sec).getTime();
}

function parsePct(v) {
  if (typeof v === 'number') return v <= 1 ? Math.round(v*100) : Math.round(v);
  if (typeof v === 'string') {
    if (v.indexOf('%') !== -1) return parseInt(v);
    var n = parseFloat(v);
    if (!isNaN(n)) return n <= 1 ? Math.round(n*100) : Math.round(n);
  }
  return null;
}

function renderClassFilter() {
  var cls = {};
  allData.forEach(function(r) { if (r['Class']) cls[r['Class']] = 1; });
  var sel = document.getElementById('classFilter');
  var cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>';
  Object.keys(cls).sort().forEach(function(c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
  sel.value = cur;
}

function renderTableHead() {
  document.getElementById('tableHead').innerHTML = '<tr>' + COLUMNS.map(function(col) {
    var ind = col.sortable && col.key === sortColumn ? (sortDirection === 'asc' ? ' \u25B2' : ' \u25BC') : '';
    var oc = col.sortable ? ' onclick="sortBy(\'' + col.key + '\')"' : '';
    var st = col.sortable ? ' style="cursor:pointer"' : '';
    return '<th' + oc + st + '>' + col.label + '<span class="sort-indicator">' + ind + '</span></th>';
  }).join('') + '</tr>';
}

function sortBy(k) {
  if (sortColumn === k) { sortDirection = sortDirection === 'asc' ? 'desc' : 'asc'; }
  else { sortColumn = k; sortDirection = 'asc'; }
  renderTableHead(); renderTable();
}

function renderTable() {
  var cf = document.getElementById('classFilter').value;
  var s = document.getElementById('searchInput').value.toLowerCase();
  var filtered = allData.filter(function(r) {
    if (cf && r['Class'] !== cf) return false;
    if (s && r['Nickname'] && r['Nickname'].toLowerCase().indexOf(s) === -1) return false;
    return true;
  });
  filtered.sort(function(a, b) {
    var va = a[sortColumn] || '', vb = b[sortColumn] || '';

    // 日期列优先按日期排序（避免 parseFloat 把 "9/28/..." 解析成 9）
    if (sortColumn === 'Submitted At') {
      var da = parseDate(va), db = parseDate(vb);
      if (da && db) return sortDirection === 'asc' ? da - db : db - da;
      if (da) return sortDirection === 'asc' ? -1 : 1;
      if (db) return sortDirection === 'asc' ? 1 : -1;
    }

    // 数值排序
    var na = parseFloat(va), nb = parseFloat(vb);
    if (!isNaN(na) && !isNaN(nb)) return sortDirection === 'asc' ? na - nb : nb - na;

    // 字符串排序
    return sortDirection === 'asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
  });
  var tb = document.getElementById('tableBody');
  if (!filtered.length) {
    tb.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="icon">\uD83D\uDCED</div>没有匹配的数据</div></td></tr>';
    return;
  }
  tb.innerHTML = filtered.map(function(row) {
    return '<tr>' + COLUMNS.map(function(col) {
      var v = row[col.key] || '';
      if (col.isPct) {
        var p = parsePct(v);
        if (p != null) {
          var c = p >= 80 ? 'pct-high' : (p >= 60 ? 'pct-mid' : 'pct-low');
          return '<td><span class="' + c + '">' + esc(v) + '</span></td>';
        }
        return '<td>' + esc(v) + '</td>';
      }
      if (col.isGame) return '<td><span class="game-tag">' + esc(v) + '</span></td>';
      if (col.suffix) return '<td>' + esc(v) + col.suffix + '</td>';
      if (col.key === 'Hardest Items') return '<td style="max-width:220px;white-space:normal;font-size:12px;color:#5f6368;">' + esc(v) + '</td>';
      if (col.key === 'Extra Attempts') {
        var ea = parseInt(v);
        return '<td>' + (ea > 0 ? '<span style="color:#e37400;font-weight:600;">' + ea + '</span>' : '<span style="color:#1e8e3e;">0</span>') + '</td>';
      }
      return '<td>' + esc(v) + '</td>';
    }).join('') + '</tr>';
  }).join('');
}

function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function exportCSV() {
  if (!allData.length) { alert('没有数据可导出'); return; }
  var cf = document.getElementById('classFilter').value;
  var s = document.getElementById('searchInput').value.toLowerCase();
  var filtered = allData.filter(function(r) {
    if (cf && r['Class'] !== cf) return false;
    if (s && r['Nickname'] && r['Nickname'].toLowerCase().indexOf(s) === -1) return false;
    return true;
  });
  var headers = COLUMNS.map(function(c) { return c.key; });
  var lines = [headers.map(function(h) { return '"' + h + '"'; }).join(',')];
  filtered.forEach(function(r) {
    lines.push(headers.map(function(h) { return '"' + String(r[h]||'').replace(/"/g,'""') + '"'; }).join(','));
  });
  var csv = '\uFEFF' + lines.join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'hanzi-results-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
}
</script>

</body>
</html>
