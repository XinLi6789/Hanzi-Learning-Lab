<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉字字组学习 · Hanzi Character Groups</title>
<style>
:root {
  --bg: #f7f8fb;
  --text: #17243d;
  --muted: #607089;
  --card: #ffffff;
  --border: #dfe5ee;
  --primary: #3859a8;
  --primary-light: #e8eef8;
  --accent: #e8743b;
  --accent-light: #fef0e6;
  --green: #2da771;
  --green-light: #e6f6ee;
  --red: #d64545;
  --radius: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Arial, "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.cn { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }

/* ── Header ── */
header {
  background: linear-gradient(135deg, #3859a8 0%, #2a4778 100%);
  color: #fff;
  padding: 28px 20px 22px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.12);
}
header h1 { margin: 0; font-size: 24px; font-weight: 800; }
header .sub { font-size: 14px; opacity: .85; margin-top: 4px; }
header nav { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
header nav button {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
}
header nav button:hover, header nav button.active {
  background: rgba(255,255,255,.3);
  border-color: rgba(255,255,255,.5);
}

/* ── Layout ── */
.container { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

/* ── Group Card ── */
.group-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
  transition: box-shadow .2s;
}
.group-card:hover { box-shadow: 0 4px 20px rgba(23,36,61,.06); }
.group-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
}
.group-num {
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  background: var(--primary-light);
  border-radius: 6px;
  padding: 3px 8px;
  flex-shrink: 0;
}
.group-chars {
  font-size: 22px;
  font-weight: 700;
  flex: 1;
  letter-spacing: 2px;
}
.group-chars .target { color: var(--primary); }
.group-chars .shared { color: var(--accent); }
.group-tag {
  font-size: 11px;
  color: var(--muted);
  background: #f0f3f7;
  border-radius: 6px;
  padding: 3px 8px;
  flex-shrink: 0;
}
.group-arrow {
  color: var(--muted);
  font-size: 14px;
  transition: transform .2s;
}
.group-card.open .group-arrow { transform: rotate(90deg); }

/* ── Group Body (collapsed) ── */
.group-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height .3s ease;
}
.group-card.open .group-body { max-height: 3000px; }

/* ── Word Cards ── */
.words-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
  padding: 0 18px 18px;
}
.word-card {
  background: #fbfcfe;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  position: relative;
  transition: all .15s;
}
.word-card:hover {
  border-color: var(--primary);
  background: #fff;
}

/* Target character highlight in the word */
.word-context {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 6px;
}
.word-context .hl {
  color: var(--accent);
  border-bottom: 3px solid var(--accent);
  padding-bottom: 1px;
}
.word-context .hl-alt {
  color: var(--primary);
  border-bottom: 3px solid var(--primary);
  padding-bottom: 1px;
}

.word-pinyin {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 2px;
}
.word-pinyin .tone-1 { color: #e8743b; }
.word-pinyin .tone-2 { color: #2da771; }
.word-pinyin .tone-3 { color: #3859a8; }
.word-pinyin .tone-4 { color: #d64545; }
.word-pinyin .tone-0 { color: var(--muted); }

.word-en {
  font-size: 14px;
  color: var(--text);
  opacity: .7;
}

/* Component clue */
.component-clue {
  margin-top: 10px;
  padding: 8px 12px;
  background: var(--green-light);
  border-radius: 8px;
  font-size: 13px;
  color: #1a6b48;
  display: flex;
  align-items: center;
  gap: 6px;
}
.component-clue .icon { font-size: 16px; }

/* ── Practice Section ── */
.practice-section {
  background: var(--accent-light);
  border-radius: 12px;
  padding: 14px;
  margin: 0 18px 18px;
}
.practice-section h4 {
  margin: 0 0 10px;
  font-size: 14px;
  color: var(--accent);
  font-weight: 800;
}
.practice-item {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
}
.practice-item:last-child { margin-bottom: 0; }
.practice-question {
  font-size: 18px;
  margin-bottom: 8px;
  line-height: 1.5;
}
.practice-question .blank {
  display: inline-block;
  width: 36px;
  border-bottom: 3px solid var(--accent);
  text-align: center;
  color: transparent;
}
.practice-question .blank.filled {
  color: var(--accent);
  font-weight: 700;
}
.practice-question .blank.correct {
  color: var(--green);
  border-color: var(--green);
}
.practice-question .blank.wrong {
  color: var(--red);
  border-color: var(--red);
}
.practice-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.practice-options button {
  background: #f0f3f7;
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
.practice-options button:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}
.practice-options button.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}
.practice-options button.correct {
  border-color: var(--green);
  background: var(--green-light);
}
.practice-options button.wrong {
  border-color: var(--red);
  background: #fdeaea;
}
.practice-feedback {
  font-size: 13px;
  margin-top: 6px;
  display: none;
}
.practice-feedback.show { display: block; }
.practice-feedback.ok { color: var(--green); }
.practice-feedback.no { color: var(--red); }

/* ── Section Title ── */
.section-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin: 24px 0 12px;
  padding-left: 12px;
  border-left: 4px solid var(--primary);
}

/* ── Filter ── */
.filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.filter-bar button {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
  transition: all .15s;
}
.filter-bar button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* ── Back to top ── */
.back-top {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--primary);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  font-size: 18px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 50;
}
.back-top.show { opacity: 1; pointer-events: auto; }

/* ── Student Info Bar ── */
.student-bar {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.student-bar label { font-size: 14px; font-weight: 700; color: var(--text); }
.student-bar input {
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 15px;
  flex: 1;
  min-width: 100px;
  outline: none;
  transition: border-color .15s;
}
.student-bar input:focus { border-color: var(--primary); }
.student-bar .student-name { flex: 1.5; }
.student-bar .student-class { flex: 1; max-width: 120px; }
.student-bar .student-hint {
  font-size: 12px;
  color: var(--muted);
  width: 100%;
  margin-top: 4px;
}

/* ── Group Result Banner ── */
.group-result {
  display: none;
  margin: 0 18px 14px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
}
.group-result.show { display: block; }
.group-result.complete {
  background: var(--green-light);
  color: #1a6b48;
}
.group-result .score { font-size: 22px; font-weight: 800; }

/* ── Submit Banner ── */
.submit-banner {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--primary);
  color: #fff;
  padding: 14px 20px;
  text-align: center;
  z-index: 200;
  box-shadow: 0 -4px 20px rgba(0,0,0,.15);
}
.submit-banner.show { display: block; }
.submit-banner button {
  background: #fff;
  color: var(--primary);
  border: none;
  border-radius: 8px;
  padding: 8px 24px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  margin-left: 10px;
}
.submit-banner button:hover { background: var(--primary-light); }

/* ── Responsive ── */
@media (max-width: 600px) {
  header h1 { font-size: 20px; }
  .group-chars { font-size: 18px; }
  .word-context { font-size: 22px; }
  .words-grid { grid-template-columns: 1fr; }
  .student-bar input { min-width: 80px; }
}
</style>
</head>
<body>

<header>
  <h1 class="cn">汉字字组学习 <span style="font-size:16px;opacity:.7">Hanzi Character Groups</span></h1>
  <div class="sub">30组字 · 在词语中辨字 · 适用于泰国中学生</div>
  <nav id="sectionNav">
    <button data-section="all" class="active">全部</button>
    <button data-section="共同部件">共同部件</button>
    <button data-section="形近字">形近字</button>
    <button data-section="同音用法">同音用法</button>
    <button data-section="练习模式">练习模式</button>
  </nav>
</header>

<div class="container">

<div class="student-bar">
  <label>姓名</label>
  <input type="text" id="studentName" class="student-name" placeholder="如：Ploy" autocomplete="name">
  <label>班级</label>
  <input type="text" id="studentClass" class="student-class" placeholder="如：G10" autocomplete="off">
  <div class="student-hint">输入姓名和班级后开始做题，做完每组后会自动记录成绩。完成后点底部"提交成绩"按钮。</div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="active" data-filter="all">全部 30组</button>
  <button data-filter="共同部件">共同部件 (1-16)</button>
  <button data-filter="形近字">形近字 (17-28)</button>
  <button data-filter="同音用法">同音用法 (29-30)</button>
</div>

<div id="groupsContainer"></div>

</div>

<div class="submit-banner" id="submitBanner">
  <span id="submitStatus">做完练习了吗？</span>
  <button onclick="submitResults()">提交成绩</button>
</div>

<button class="back-top" onclick="scrollTo(0,0)" id="backTop">↑</button>

<iframe name="formTarget" style="display:none"></iframe>

<script>
// ═══════════════════════════════════════════════════════════
//  DATA: 30 character groups with contextual words
//  Each character is shown IN A WORD/PHRASE, never alone
// ═══════════════════════════════════════════════════════════

var GROUPS = [
  // ── 一 共同部件与读音联系 起步联系 ──
  {
    num: 1, chars: ["妈","吗","马","码"], shared: "马",
    category: "共同部件", section: "起步联系",
    note: "共同部件马；注意声调及轻声",
    words: [
      { word: "妈妈", pinyin: "māma", en: "mum", target: "妈", pos: 0 },
      { word: "你好吗", pinyin: "nǐ hǎo ma", en: "How are you?", target: "吗", pos: 2 },
      { word: "骑马", pinyin: "qí mǎ", en: "ride a horse", target: "马", pos: 1 },
      { word: "电话号码", pinyin: "diànhuà hàomǎ", en: "phone number", target: "码", pos: 3 },
    ],
    practices: [
      { q: "我___今年四十岁。", options: ["妈","吗","码"], answer: 0 },
      { q: "你好___？我是大卫。", options: ["妈","吗","马"], answer: 1 },
      { q: "那个小朋友在骑___。", options: ["吗","马","码"], answer: 1 },
      { q: "老师的电话号___是多少？", options: ["码","马","妈"], answer: 0 },
    ]
  },
  {
    num: 2, chars: ["爸","巴","吧","把"], shared: "巴",
    category: "共同部件", section: "起步联系",
    note: "共同部件巴；字形和声调一起比较",
    words: [
      { word: "爸爸", pinyin: "bàba", en: "dad", target: "爸", pos: 0 },
      { word: "嘴巴", pinyin: "zuǐba", en: "mouth", target: "巴", pos: 1 },
      { word: "好吧", pinyin: "hǎo ba", en: "OK then", target: "吧", pos: 1 },
      { word: "一把尺子", pinyin: "yì bǎ chǐzi", en: "a ruler", target: "把", pos: 1 },
    ],
    practices: [
      { q: "我___在学校教书。", options: ["爸","巴","吧"], answer: 0 },
      { q: "小弟弟的嘴___很大。", options: ["爸","巴","吧"], answer: 1 },
      { q: "我们去打球，好___？", options: ["把","巴","吧"], answer: 2 },
      { q: "桌子上有一___尺子。", options: ["把","爸","巴"], answer: 0 },
    ]
  },
  {
    num: 3, chars: ["他","她","地"], shared: "也",
    category: "共同部件", section: "起步联系",
    note: "他与她同音，地在地铁中读dì",
    words: [
      { word: "他是老师", pinyin: "tā shì lǎoshī", en: "He is a teacher", target: "他", pos: 0 },
      { word: "她是学生", pinyin: "tā shì xuéshēng", en: "She is a student", target: "她", pos: 0 },
      { word: "坐地铁", pinyin: "zuò dìtiě", en: "take the subway", target: "地", pos: 1 },
    ],
    practices: [
      { q: "___是我的好朋友，___叫安娜。", options: ["他","她","地"], answer: 1 },
      { q: "___今天没来上课，___生病了。", options: ["她","他","地"], answer: 1 },
      { q: "我每天坐___铁上学。", options: ["他","地","她"], answer: 1 },
    ]
  },
  {
    num: 4, chars: ["青","晴","睛","请","情"], shared: "青",
    category: "共同部件", section: "起步联系",
    note: "青作读音线索；日、目、讠、忄帮助区分",
    words: [
      { word: "青菜", pinyin: "qīngcài", en: "green vegetables", target: "青", pos: 0 },
      { word: "今天是晴天", pinyin: "jīntiān shì qíngtiān", en: "It's sunny today", target: "晴", pos: 2 },
      { word: "我的眼睛", pinyin: "wǒ de yǎnjing", en: "my eyes", target: "睛", pos: 2 },
      { word: "请进", pinyin: "qǐng jìn", en: "please come in", target: "请", pos: 0 },
      { word: "事情", pinyin: "shìqing", en: "matter; thing", target: "情", pos: 1 },
    ],
    practices: [
      { q: "妈妈炒了___菜，很好吃。", options: ["青","晴","睛"], answer: 0 },
      { q: "今天天气很好，是___天。", options: ["睛","晴","情"], answer: 1 },
      { q: "我的眼___不舒服。", options: ["睛","晴","请"], answer: 0 },
      { q: "___进！老师在里面等你。", options: ["情","晴","请"], answer: 2 },
      { q: "这是怎么一回___？", options: ["请","情","睛"], answer: 1 },
    ]
  },
  // ── 二 共同部件与读音联系 日常词语 ──
  {
    num: 5, chars: ["包","跑","饱"], shared: "包",
    category: "共同部件", section: "日常词语",
    note: "足与动作、饣与吃有关",
    words: [
      { word: "汉堡包", pinyin: "hànbǎobāo", en: "hamburger", target: "包", pos: 2 },
      { word: "跑步", pinyin: "pǎobù", en: "run; jog", target: "跑", pos: 0 },
      { word: "吃饱了", pinyin: "chī bǎo le", en: "full after eating", target: "饱", pos: 1 },
    ],
    practices: [
      { q: "午饭我吃了一个汉___。", options: ["跑","包","饱"], answer: 1 },
      { q: "每天早上我___步锻炼身体。", options: ["包","饱","跑"], answer: 2 },
      { q: "我吃___了，吃不下了。", options: ["饱","包","跑"], answer: 0 },
    ]
  },
  {
    num: 6, chars: ["方","房","放"], shared: "方",
    category: "共同部件", section: "日常词语",
    note: "用词语确认意思",
    words: [
      { word: "这个地方", pinyin: "zhège dìfang", en: "this place", target: "方", pos: 2 },
      { word: "书房", pinyin: "shūfáng", en: "study room", target: "房", pos: 1 },
      { word: "放学了", pinyin: "fàngxué le", en: "school finishes", target: "放", pos: 0 },
    ],
    practices: [
      { q: "这___很安静，适合看书。", options: ["房","方","放"], answer: 1 },
      { q: "爸爸在书___里工作。", options: ["放","房","方"], answer: 1 },
      { q: "___学了，我们一起回家。", options: ["放","房","方"], answer: 0 },

  },
  {
    num: 7, chars: ["羊","洋","样"], shared: "羊",
    category: "共同部件", section: "日常词语",
    note: "读音接近；不能只靠偏旁猜完整词义",
    words: [
      { word: "羊肉", pinyin: "yángròu", en: "lamb; mutton", target: "羊", pos: 0 },
      { word: "大洋洲", pinyin: "Dàyángzhōu", en: "Oceania", target: "洋", pos: 1 },
      { word: "一样", pinyin: "yíyàng", en: "the same", target: "样", pos: 1 },
    ],
    practices: [
      { q: "冬天吃___肉火锅很暖和。", options: ["羊","样","洋"], answer: 0 },

      { q: "我们两个___高。", options: ["羊","洋","样"], answer: 2 },
    ]
  },
  {
    num: 8, chars: ["古","姑","故"], shared: "古",
    category: "共同部件", section: "日常词语",
    note: "结合人物与旅游词语",
    words: [

      { word: "姑姑", pinyin: "gūgu", en: "paternal aunt", target: "姑", pos: 0 },
      { word: "故宫", pinyin: "Gùgōng", en: "the Palace Museum", target: "故", pos: 0 },
    ],
    practices: [
      { q: "我们去参观了___宫。", options: ["姑","故","古"], answer: 1 },
      { q: "我的___姑住在上海。", options: ["古","故","姑"], answer: 2 },
      { q: "这个地方有很多___迹。", options: ["古","故","姑"], answer: 0 },
    ]
  },
  // ── 三 共同部件与读音联系 跨册复习 ──
  {
    num: 9, chars: ["白","怕","拍","伯"], shared: "白",
    category: "共同部件", section: "跨册复习",
    note: "共同部件白；现代读音差异较大",
    words: [
      { word: "白色", pinyin: "báisè", en: "white color", target: "白", pos: 0 },
      { word: "我怕狗", pinyin: "wǒ pà gǒu", en: "I'm afraid of dogs", target: "怕", pos: 1 },
      { word: "拍照片", pinyin: "pāi zhàopiàn", en: "take photos", target: "拍", pos: 0 },
      { word: "大伯", pinyin: "dàbó", en: "father's elder brother", target: "伯", pos: 1 },

function renderGroups(filter) {
  var container = document.getElementById('groupsContainer');
  var html = '';
  var lastSection = '';

  var filtered = filter === 'all' ? GROUPS : GROUPS.filter(function(g) {
    return g.category === filter;
  });

  filtered.forEach(function(g) {
    // Section divider
    if (g.section !== lastSection) {
      lastSection = g.section;
      var romanMap = {
        '起步联系': '一', '日常词语': '二', '跨册复习': '三', '补充联系': '四',
        '笔画与结构': '五', '词语中的区别': '六', '学校与生活': '七', '同音字用法': '八'
      };
      html += '<div class="section-title">' + (romanMap[g.section] || '') + ' ' + g.section + '</div>';
    }

    // Group header chars with shared part highlighted
    var charsHtml = g.chars.map(function(c) {
      if (g.shared && c.indexOf(g.shared) >= 0) {
        // Highlight the shared component in each character
        var idx = c.indexOf(g.shared);
        if (c === g.shared) {
          return '<span class="shared">' + c + '</span>';
        }
        // For characters containing the shared component, highlight just that part
        return c; // Can't easily highlight sub-component in display, keep as is
      }
      return '<span class="target">' + c + '</span>';
    }).join(' ');

    html += '<div class="group-card" data-num="' + g.num + '">';
    html += '<div class="group-header" onclick="toggleGroup(this)">';
    html += '<span class="group-num">第' + g.num + '组</span>';
    html += '<span class="group-chars cn">' + charsHtml + '</span>';
    if (g.shared) {
      html += '<span class="group-tag cn">共同部件：' + g.shared + '</span>';
    } else {
      html += '<span class="group-tag cn">' + g.section + '</span>';
    }
    html += '<span class="group-arrow">▶</span>';
    html += '</div>';

    // Body
    html += '<div class="group-body">';

    // Word cards
    html += '<div class="words-grid">';
    g.words.forEach(function(w) {
      // Build the word with the target character highlighted
      var wordHtml = '';
      for (var i = 0; i < w.word.length; i++) {
        if (i === w.pos) {
          wordHtml += '<span class="hl">' + w.word[i] + '</span>';
        } else {
          wordHtml += w.word[i];
        }
      }

      html += '<div class="word-card">';
      html += '<div class="word-context cn">' + wordHtml + '</div>';
      html += '<div class="word-pinyin">' + w.pinyin + '</div>';
      html += '<div class="word-en">' + w.en + '</div>';
      html += '</div>';
    });
    html += '</div>';

    // Component clue
    if (g.shared) {
      html += '<div class="component-clue" style="margin:0 18px 14px">';
      html += '<span class="icon">💡</span>';
      html += '<span class="cn">' + g.note + '</span>';
      html += '</div>';
    }

    // Practice
    if (g.practices && g.practices.length) {
      html += '<div class="practice-section">';
      html += '<h4>✏️ 选字填空</h4>';
      g.practices.forEach(function(p, pi) {
        var qHtml = '';
        // Replace ___ with blank span
        qHtml = p.q.replace('___', '<span class="blank" data-group="' + g.num + '" data-practice="' + pi + '">？</span>');

        html += '<div class="practice-item">';
        html += '<div class="practice-question cn">' + qHtml + '</div>';
        html += '<div class="practice-options">';
        p.options.forEach(function(opt, oi) {
          html += '<button onclick="checkAnswer(this,' + g.num + ',' + pi + ',' + oi + ',' + p.answer + ')" class="cn">' + opt + '</button>';
        });
        html += '</div>';
        html += '<div class="practice-feedback" id="fb-' + g.num + '-' + pi + '"></div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>'; // group-body
    html += '<div class="group-result" id="result-' + g.num + '"></div>';
    html += '</div>'; // group-card
  });

  container.innerHTML = html;
}

// Track answers per group: { groupNum: { practiceIdx: { correct: bool, selected: string, answer: string } } }
var answerTracker = {};

function toggleGroup(headerEl) {
  var card = headerEl.closest('.group-card');
  card.classList.toggle('open');
}

function checkAnswer(btn, groupNum, practiceIdx, selectedIdx, correctIdx) {
  var allBtns = btn.parentElement.querySelectorAll('button');
  allBtns.forEach(function(b) { b.classList.remove('selected', 'correct', 'wrong'); });

  // Disable all buttons after answering
  allBtns.forEach(function(b) { b.style.pointerEvents = 'none'; b.style.opacity = '0.6'; });

  var blank = document.querySelector('.blank[data-group="' + groupNum + '"][data-practice="' + practiceIdx + '"]');
  var feedback = document.getElementById('fb-' + groupNum + '-' + practiceIdx);
  var isCorrect = selectedIdx === correctIdx;

  if (isCorrect) {
    btn.classList.add('correct');
    if (blank) {
      blank.classList.add('filled', 'correct');
      blank.textContent = btn.textContent;
    }
    feedback.className = 'practice-feedback show ok';
    feedback.textContent = '✓ 正确！';
    btn.style.opacity = '1';
  } else {
    btn.classList.add('wrong');
    allBtns[correctIdx].classList.add('correct');
    if (blank) {
      blank.classList.add('filled', 'wrong');
      blank.textContent = btn.textContent;
    }
    feedback.className = 'practice-feedback show no';
    feedback.textContent = '✗ 正确答案：' + allBtns[correctIdx].textContent;
    allBtns[correctIdx].style.opacity = '1';
  }

  // Track answer
  if (!answerTracker[groupNum]) answerTracker[groupNum] = {};
  answerTracker[groupNum][practiceIdx] = {
    correct: isCorrect,
    selected: btn.textContent,
    answer: allBtns[correctIdx].textContent
  };

  // Check if all questions in this group are answered
  checkGroupComplete(groupNum);
}

function checkGroupComplete(groupNum) {
  // Find the group data
  var group = GROUPS.find(function(g) { return g.num === groupNum; });
  if (!group || !group.practices) return;

  var answered = answerTracker[groupNum] || {};
  var total = group.practices.length;
  var answeredCount = Object.keys(answered).length;

  if (answeredCount >= total) {
    // All answered — show result
    var correctCount = 0;
    var wrongDetails = [];
    group.practices.forEach(function(p, pi) {
      if (answered[pi] && answered[pi].correct) {
        correctCount++;
      } else {
        wrongDetails.push('第' + (pi+1) + '题(选' + answered[pi].selected + ',正确' + answered[pi].answer + ')');
      }
    });

    var rate = Math.round(correctCount / total * 100);
    var resultEl = document.getElementById('result-' + groupNum);
    if (resultEl) {
      resultEl.className = 'group-result show complete';
      resultEl.innerHTML = '<span class="score">' + correctCount + '/' + total + '</span> 正确率 ' + rate + '%' +
        (wrongDetails.length > 0 ? '<br><span style="font-size:13px;font-weight:400">错题：' + wrongDetails.join('，') + '</span>' : '');
    }

    // Show submit banner
    showSubmitBanner();
  }
}

function showSubmitBanner() {
  var banner = document.getElementById('submitBanner');
  var status = document.getElementById('submitStatus');

  // Count total answered groups
  var answeredGroups = Object.keys(answerTracker).length;
  var totalGroups = GROUPS.filter(function(g) { return g.practices && g.practices.length; }).length;

  if (answeredGroups > 0) {
    banner.classList.add('show');
    if (answeredGroups >= totalGroups) {
      status.textContent = '所有练习已完成！点击提交成绩。';
    } else {
      status.textContent = '已完成 ' + answeredGroups + '/' + totalGroups + ' 组练习。做完后点这里提交成绩。';
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  SUBMIT RESULTS TO GOOGLE FORM
// ═══════════════════════════════════════════════════════════

// TODO: Replace with your actual Google Form ID and entry IDs
var GOOGLE_FORM_ID = 'FORM_ID_HERE';
var FORM_ENTRY = {
  name: 'entry.XXXXXX',
  class: 'entry.XXXXXX',
  group: 'entry.XXXXXX',
  total: 'entry.XXXXXX',
  correct: 'entry.XXXXXX',
  rate: 'entry.XXXXXX',
  details: 'entry.XXXXXX',
  date: 'entry.XXXXXX'
};

function submitResults() {
  var name = document.getElementById('studentName').value.trim();
  var className = document.getElementById('studentClass').value.trim();

  if (!name) {
    alert('请先输入你的姓名！');
    document.getElementById('studentName').focus();
    return;
  }
  if (!className) {
    alert('请先输入你的班级！');
    document.getElementById('studentClass').focus();
    return;
  }

  var answeredGroups = Object.keys(answerTracker);
  if (answeredGroups.length === 0) {
    alert('你还没有做任何练习，请先做题再提交！');
    return;
  }

  // If Google Form is not configured, show results summary instead
  if (GOOGLE_FORM_ID === 'FORM_ID_HERE') {
    showResultsSummary(name, className);
    return;
  }

  // Submit each group's results to Google Form
  var submittedCount = 0;
  var now = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Bangkok' });

  answeredGroups.forEach(function(gNum) {
    var group = GROUPS.find(function(g) { return g.num === parseInt(gNum); });
    if (!group) return;

    var answers = answerTracker[gNum];
    var total = group.practices.length;
    var correct = 0;
    var details = [];

    group.practices.forEach(function(p, pi) {
      if (answers[pi]) {
        if (answers[pi].correct) {
          correct++;
        } else {
          details.push('Q' + (pi+1) + ':选' + answers[pi].selected + '/正' + answers[pi].answer);
        }
      }
    });

    var rate = Math.round(correct / total * 100);
    var detailStr = details.length ? details.join('; ') : '全对';

    // Build form URL
    var formUrl = 'https://docs.google.com/forms/d/' + GOOGLE_FORM_ID + '/formResponse';
    var params = new URLSearchParams();
    params.append(FORM_ENTRY.name, name);
    params.append(FORM_ENTRY.class, className);
    params.append(FORM_ENTRY.group, '第' + gNum + '组 ' + group.chars.join(''));
    params.append(FORM_ENTRY.total, total);
    params.append(FORM_ENTRY.correct, correct);
    params.append(FORM_ENTRY.rate, rate + '%');
    params.append(FORM_ENTRY.details, detailStr);
    params.append(FORM_ENTRY.date, now);

    // Submit via hidden iframe (no CORS needed)
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = formUrl;
    form.target = 'formTarget';

    Object.keys(FORM_ENTRY).forEach(function(key) {
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = FORM_ENTRY[key];
      input.value = params.get(FORM_ENTRY[key]);
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
    document.body.removeChild(form);
    submittedCount++;
  });

  // Show success message
  setTimeout(function() {
    showResultsSummary(name, className);
  }, 500);
}

function showResultsSummary(name, className) {
  var answeredGroups = Object.keys(answerTracker);
  var totalQ = 0, totalCorrect = 0;
  var summary = [];

  answeredGroups.forEach(function(gNum) {
    var group = GROUPS.find(function(g) { return g.num === parseInt(gNum); });
    if (!group) return;
    var answers = answerTracker[gNum];
    var total = group.practices.length;
    var correct = 0;
    group.practices.forEach(function(p, pi) {
      if (answers[pi] && answers[pi].correct) correct++;
    });
    totalQ += total;
    totalCorrect += correct;
    summary.push('第' + gNum + '组: ' + correct + '/' + total);
  });

  var overallRate = totalQ > 0 ? Math.round(totalCorrect / totalQ * 100) : 0;

  var html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px" onclick="this.remove()">';
  html += '<div style="background:#fff;border-radius:16px;padding:30px;max-width:400px;width:100%;max-height:80vh;overflow:auto;text-align:center">';
  html += '<h2 style="margin:0 0 8px;color:#3859a8">成绩单</h2>';
  html += '<p style="font-size:18px;margin:4px 0">' + name + ' · ' + className + '</p>';
  html += '<div style="font-size:48px;font-weight:900;color:' + (overallRate >= 80 ? '#2da771' : overallRate >= 60 ? '#e8743b' : '#d64545') + ';margin:16px 0">' + overallRate + '%</div>';
  html += '<p style="font-size:16px;color:#607089">总正确 ' + totalCorrect + '/' + totalQ + ' 题</p>';
  html += '<div style="text-align:left;margin:16px 0;padding:12px;background:#f7f8fb;border-radius:8px;font-size:14px;line-height:2">';
  summary.forEach(function(s) { html += '<div>' + s + '</div>'; });
  html += '</div>';

  if (GOOGLE_FORM_ID === 'FORM_ID_HERE') {
    html += '<p style="font-size:13px;color:#607089;margin:12px 0">截图这个页面发给老师，或者告诉老师你的成绩。</p>';
  } else {
    html += '<p style="font-size:14px;color:#2da771;margin:12px 0;font-weight:700">✓ 成绩已自动提交给老师！</p>';
  }

  html += '<button onclick="this.closest(\'div[style*="fixed"]\').remove()" style="background:#3859a8;color:#fff;border:none;border-radius:10px;padding:12px 30px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px">关闭</button>';
  html += '</div></div>';

  document.body.insertAdjacentHTML('beforeend', html);

  // Hide submit banner
  document.getElementById('submitBanner').classList.remove('show');
}

// Filter buttons
document.getElementById('filterBar').addEventListener('click', function(e) {
  if (e.target.tagName !== 'BUTTON') return;
  this.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  e.target.classList.add('active');
  renderGroups(e.target.dataset.filter);
});

// Nav buttons
document.getElementById('sectionNav').addEventListener('click', function(e) {
  if (e.target.tagName !== 'BUTTON') return;
  this.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
  e.target.classList.add('active');

  var section = e.target.dataset.section;
  if (section === 'all') {
    document.querySelector('[data-filter="all"]').click();
  } else if (section === '共同部件') {
    document.querySelector('[data-filter="共同部件"]').click();
  } else if (section === '形近字') {
    document.querySelector('[data-filter="形近字"]').click();
  } else if (section === '同音用法') {
    document.querySelector('[data-filter="同音用法"]').click();
  } else if (section === '练习模式') {
    // Open all groups and scroll to first practice
    document.querySelectorAll('.group-card').forEach(function(c) { c.classList.add('open'); });
  }
});

// Back to top
window.addEventListener('scroll', function() {
  var btn = document.getElementById('backTop');
  if (window.scrollY > 300) btn.classList.add('show');
  else btn.classList.remove('show');
});

// Initial render
renderGroups('all');

// Auto-open first group
setTimeout(function() {
  var first = document.querySelector('.group-card');
  if (first) first.classList.add('open');
}, 100);
</script>
